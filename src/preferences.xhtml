<vbox
	xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
	xmlns:html="http://www.w3.org/1999/xhtml"
>
	<!-- Das Fragment wird in das Einstellungsfenster eingehängt, das anschließend
	     document.l10n.translateFragment() darauf aufruft (preferences.js:355). Die FTL des
	     Plugins hängt dort nicht automatisch am Dokument — ohne dieses linkset bleiben alle
	     Beschriftungen leer. Zoteros eigene Panes machen es genauso. -->
	<linkset>
		<html:link rel="localization" href="flexannotate.ftl"/>
	</linkset>

	<groupbox>
		<html:h2 data-l10n-id="flexannotate-prefs-citing-heading"/>

		<checkbox
			id="flexannotate-pref-citation-only"
			data-l10n-id="flexannotate-prefs-citation-only"
			preference="extensions.flexannotate.citationOnly"
			native="true"
		/>
		<description class="indented-pref" data-l10n-id="flexannotate-prefs-citation-only-description"/>
	</groupbox>

	<groupbox>
		<html:h2 data-l10n-id="flexannotate-prefs-placeholder-heading"/>

		<checkbox
			id="flexannotate-pref-keep-placeholders"
			data-l10n-id="flexannotate-prefs-keep-placeholders"
			preference="extensions.flexannotate.keepEmptyPlaceholders"
			native="true"
		/>
		<description class="indented-pref" data-l10n-id="flexannotate-prefs-keep-placeholders-description"/>
	</groupbox>

	<groupbox>
		<html:h2 data-l10n-id="flexannotate-prefs-citavi-heading"/>

		<checkbox
			id="flexannotate-pref-citavi-import"
			data-l10n-id="flexannotate-prefs-citavi-import"
			preference="extensions.flexannotate.citaviImport"
			native="true"
		/>
		<description class="indented-pref" data-l10n-id="flexannotate-prefs-citavi-import-description"/>

		<checkbox
			id="flexannotate-pref-citavi-keep-notes"
			data-l10n-id="flexannotate-prefs-citavi-keep-notes"
			preference="extensions.flexannotate.citaviKeepNotes"
			native="true"
		/>
		<description class="indented-pref" data-l10n-id="flexannotate-prefs-citavi-keep-notes-description"/>
	</groupbox>
</vbox>
