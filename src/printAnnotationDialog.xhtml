<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet href="chrome://global/skin/global.css" type="text/css"?>

<window
	xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
	xmlns:html="http://www.w3.org/1999/xhtml"
	data-l10n-id="flexannotate-dialog-title"
	onload="FlexAnnotateDialog.onLoad()"
	persist="width height"
	width="520"
	height="480"
>
	<linkset>
		<html:link rel="localization" href="flexannotate.ftl"/>
		<!-- Für die Farbnamen (general-yellow, general-red, …), die Zotero.Annotations.COLORS referenziert -->
		<html:link rel="localization" href="zotero.ftl"/>
	</linkset>

	<script src="printAnnotationDialog.js"/>

	<dialog id="flexannotate-print-annotation-dialog"
		buttons="accept,cancel"
		ondialogaccept="return FlexAnnotateDialog.onAccept()">

		<vbox style="padding: 12px; gap: 8px;">
			<label id="flexannotate-source-label" style="font-weight: bold;"/>

			<html:div style="display: grid; grid-template-columns: max-content 1fr; gap: 8px; align-items: center;">
				<label data-l10n-id="flexannotate-field-page" control="flexannotate-page"/>
				<html:input id="flexannotate-page" type="text"/>

				<label data-l10n-id="flexannotate-field-type" control="flexannotate-type"/>
				<menulist id="flexannotate-type" native="true">
					<menupopup>
						<menuitem value="highlight" data-l10n-id="flexannotate-type-highlight"/>
						<menuitem value="underline" data-l10n-id="flexannotate-type-underline"/>
						<menuitem value="note" data-l10n-id="flexannotate-type-note"/>
					</menupopup>
				</menulist>

				<label data-l10n-id="flexannotate-field-color" control="flexannotate-color"/>
				<menulist id="flexannotate-color" native="true">
					<menupopup id="flexannotate-color-popup"/>
				</menulist>
			</html:div>

			<label data-l10n-id="flexannotate-field-text" control="flexannotate-text"/>
			<html:textarea id="flexannotate-text" rows="5"/>

			<label data-l10n-id="flexannotate-field-comment" control="flexannotate-comment"/>
			<html:textarea id="flexannotate-comment" rows="4"/>
		</vbox>
	</dialog>
</window>
